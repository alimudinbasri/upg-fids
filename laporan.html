<script>
/* ============================================================
   LIVE + CACHED FLIGHT DATA
   Same approach as analytics.html: read flights_cache/{date} from
   Firestore first (fast), fall back to a live AIS/GAS fetch for any
   day not cached yet.
============================================================ */
var GAS_URL = APP_CONFIG.gasUrl;

function fmtDate(d) { return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
function fmt(v, def) { def = def===undefined?'':def; var s = String(v===null||v===undefined?'':v).trim(); return s===''||s==='-' ? def : s; }
function first(obj, keys, def) {
  def = def===undefined?'':def;
  for (var i=0;i<keys.length;i++) { var k=keys[i]; if (obj[k]!==undefined && obj[k]!==null && String(obj[k]).trim()!=='') return obj[k]; }
  return def;
}

function jsonp(action, date) {
  return new Promise(function(resolve, reject) {
    var tid = setTimeout(function(){ reject(new Error('Timeout: '+action+' '+date)); }, 20000);
    fetch(GAS_URL+'?action='+action+'&date='+encodeURIComponent(date), { cache: 'no-store' })
      .then(function(res){ if (!res.ok) throw new Error('HTTP '+res.status); return res.json(); })
      .then(function(data){ clearTimeout(tid); resolve(data); })
      .catch(function(err){ clearTimeout(tid); reject(new Error('Fetch error: '+action+' '+date+' - '+err.message)); });
  });
}
function extractRows(data) {
  if (Array.isArray(data)) return data;
  if (data && data.data && Array.isArray(data.data)) return data.data;
  if (data && typeof data==='object') { var keys=['rows','flights','result','records']; for (var i=0;i<keys.length;i++) if (Array.isArray(data[keys[i]])) return data[keys[i]]; }
  return [];
}

// Only the fields this report needs (gate/belt/type/date) - same
// field-priority lists as real_gate.html/real_belt.html/analytics.html.
function buildFlight(row, type, dateStr) {
  var flightNo = fmt(first(row, ['nopen','flight','Flight','no_flight','callsign']));
  var gate = type==='DEP' ? fmt(first(row,['gate','Gate','gate_id'])) : '';
  var belt = type==='ARR' ? fmt(first(row,['belt','Belt','carousel'])) : '';
  return { date: dateStr, type: type, flightNo: flightNo, gate: gate, belt: belt };
}

function toRowArray(v) {
  if (Array.isArray(v)) return v;
  if (typeof v === 'string' && v.trim()) {
    try { var parsed = JSON.parse(v); return Array.isArray(parsed) ? parsed : []; } catch(e) { return []; }
  }
  return [];
}
function parseFlightsCacheDoc(data, dateStr) {
  if (!data) return null;
  var arrRaw = toRowArray(data.arrivals);
  var depRaw = toRowArray(data.departures);
  if (!arrRaw.length && !depRaw.length) return null;
  var arrRows = arrRaw.map(function(r){ return buildFlight(r,'ARR',dateStr); }).filter(function(f){ return f.flightNo && f.flightNo!=='-'; });
  var depRows = depRaw.map(function(r){ return buildFlight(r,'DEP',dateStr); }).filter(function(f){ return f.flightNo && f.flightNo!=='-'; });
  return arrRows.concat(depRows);
}

function waitForDb() {
  return new Promise(function(resolve){
    if (window._db) { resolve(window._db); return; }
    var iv = setInterval(function(){ if (window._db) { clearInterval(iv); resolve(window._db); } }, 50);
  });
}
function fetchDayFromCache(dateStr) {
  return waitForDb().then(function(db){ return db.collection('flights_cache').doc(dateStr).get(); })
    .then(function(doc){ return doc.exists ? parseFlightsCacheDoc(doc.data(), dateStr) : null; })
    .catch(function(err){ console.warn('flights_cache read failed for', dateStr, err); return null; });
}
function fetchDayLive(dateStr) {
  return Promise.all([jsonp('arrival', dateStr), jsonp('departure', dateStr)]).then(function(results){
    var arrRows = extractRows(results[0]).map(function(r){ return buildFlight(r,'ARR',dateStr); }).filter(function(f){ return f.flightNo && f.flightNo!=='-'; });
    var depRows = extractRows(results[1]).map(function(r){ return buildFlight(r,'DEP',dateStr); }).filter(function(f){ return f.flightNo && f.flightNo!=='-'; });
    return arrRows.concat(depRows);
  });
}

var dayCache = {};
var LS_PREFIX = 'laporanDay_';
function loadDayFromLS(dateStr) {
  try { var raw = localStorage.getItem(LS_PREFIX+dateStr); if (!raw) return null; return JSON.parse(raw).flights; } catch(e) { return null; }
}
function saveDayToLS(dateStr, flights) {
  try { localStorage.setItem(LS_PREFIX+dateStr, JSON.stringify({flights:flights, ts:Date.now()})); } catch(e) {}
}
function fetchDay(dateStr) {
  if (dayCache[dateStr]) return Promise.resolve(dayCache[dateStr]);
  return fetchDayFromCache(dateStr).then(function(cached){
    if (cached && cached.length) return cached;
    return fetchDayLive(dateStr);
  }).catch(function(err){
    console.warn('Failed to fetch flights for', dateStr, err);
    return loadDayFromLS(dateStr) || [];
  }).then(function(dayFlights){
    dayCache[dateStr] = dayFlights;
    saveDayToLS(dateStr, dayFlights);
    return dayFlights;
  });
}
function dateRangeList(fromStr, toStr) {
  var list = [], d = new Date(fromStr+'T00:00:00'), end = new Date(toStr+'T00:00:00');
  while (d<=end) { list.push(fmtDate(d)); d.setDate(d.getDate()+1); }
  return list;
}
function fetchDays(dateList, onProgress) {
  var CONCURRENCY = 6, out = [], i = 0, done = 0;
  function next() {
    if (i>=dateList.length) return Promise.resolve(out);
    var batch = dateList.slice(i, i+CONCURRENCY); i += CONCURRENCY;
    return Promise.all(batch.map(fetchDay)).then(function(results){
      results.forEach(function(r){ out = out.concat(r); });
      done += batch.length;
      if (onProgress) onProgress(done, dateList.length);
      return next();
    });
  }
  return next();
}

/* ============================================================
   REPORT AGGREGATION + RENDER
============================================================ */
var DAY_NAMES = ['Minggu','Senin','Selasa','Rabu','Kamis','Jumat','Sabtu'];
var MONTH_ABBR = ['Jan','Feb','Mar','Apr','Mei','Jun','Jul','Ags','Sep','Okt','Nov','Des'];
function formatDayLabel(dateStr) {
  var d = new Date(dateStr+'T00:00:00');
  return DAY_NAMES[d.getDay()]+', '+String(d.getDate()).padStart(2,'0')+' '+MONTH_ABBR[d.getMonth()]+' '+d.getFullYear();
}
function formatShortDate(dateStr) {
  var d = new Date(dateStr+'T00:00:00');
  return String(d.getDate()).padStart(2,'0')+'-'+MONTH_ABBR[d.getMonth()]+'-'+d.getFullYear();
}
// Matches the PDF example's rounding: 2 decimals, comma separator,
// trailing ",00" dropped entirely (e.g. 70/7 -> "10", not "10,00").
function formatAvg(n) {
  var s = n.toFixed(2);
  if (s.slice(-3)==='.00') s = s.slice(0,-3);
  return s.replace('.',',');
}
function isFilledSlot(v) {
  v = String(v||'').trim().toUpperCase();
  return !!v && v!=='NO GATE' && v!=='NO BELT' && v!=='UNASSIGNED' && v!=='-' && v!=='N/A' && v!=='NA' && v!=='NULL';
}

var lastReport = null; // kept for PDF export

function aggregateReport(flights, dateList, mode) {
  var items = (mode==='belt' ? APP_CONFIG.defaultBelts : APP_CONFIG.defaultGates).slice();
  var typeFilter = mode==='belt' ? 'ARR' : 'DEP';

  var dayMatrix = {};
  dateList.forEach(function(d){ dayMatrix[d] = {}; items.forEach(function(it){ dayMatrix[d][it]=0; }); });
  var itemTotals = {}; items.forEach(function(it){ itemTotals[it]=0; });

  flights.forEach(function(f) {
    if (f.type !== typeFilter) return;
    var val = String((mode==='belt'?f.belt:f.gate)||'').trim().toUpperCase();
    if (!isFilledSlot(val)) return;
    if (!dayMatrix[f.date]) return;
    if (dayMatrix[f.date][val]===undefined) { dayMatrix[f.date][val]=0; }
    if (itemTotals[val]===undefined) { itemTotals[val]=0; items.push(val); }
    dayMatrix[f.date][val]++;
    itemTotals[val]++;
  });

  return { dayMatrix: dayMatrix, itemTotals: itemTotals, items: items, dateList: dateList, mode: mode };
}

function renderReport(rep) {
  var label = rep.mode==='belt' ? 'Belt' : 'Gate';
  var nDays = rep.dateList.length;
  var grandTotal = 0;

  var dayRows = rep.dateList.map(function(d) {
    var rowTotal = 0;
    var cells = rep.items.map(function(it) {
      var c = rep.dayMatrix[d][it]||0;
      rowTotal += c;
      return '<td class="num">'+c+'</td>';
    }).join('');
    grandTotal += rowTotal;
    return '<tr><td>'+formatDayLabel(d)+'</td>'+cells+'<td class="num"><b>'+rowTotal+'</b></td></tr>';
  }).join('');

  var totalCells = rep.items.map(function(it) {
    return '<td class="num">'+(rep.itemTotals[it]||0)+'</td>';
  }).join('');

  var summaryRows = rep.items.map(function(it) {
    var total = rep.itemTotals[it]||0;
    return '<tr><td>'+label+' '+it+'</td><td class="num">'+total+'</td><td class="num">'+formatAvg(total/nDays)+'</td></tr>';
  }).join('');

  var html =
    '<div class="panel">' +
      '<h2>Realisasi Penggunaan '+(rep.mode==='belt'?'Conveyor Belt':'Gate')+' per Hari</h2>' +
      '<div class="sub">Periode '+formatShortDate(rep.dateList[0])+' &ndash; '+formatShortDate(rep.dateList[rep.dateList.length-1])+' ('+nDays+' hari)</div>' +
      '<div class="table-scroll"><table class="rep-table" id="tblDaily">' +
        '<thead><tr><th>Hari / Tanggal</th>' + rep.items.map(function(it){ return '<th>'+label+' '+it+'</th>'; }).join('') + '<th>Total Flight</th></tr></thead>' +
        '<tbody>' + dayRows + '<tr class="total-row"><td>TOTAL '+nDays+' HARI</td>'+totalCells+'<td class="num">'+grandTotal+'</td></tr></tbody>' +
      '</table></div>' +
    '</div>' +
    '<div class="panel">' +
      '<h2>Rekap Penggunaan per '+(rep.mode==='belt'?'Conveyor Belt':'Gate')+'</h2>' +
      '<div class="table-scroll"><table class="rep-table" id="tblSummary">' +
        '<thead><tr><th>'+(rep.mode==='belt'?'Conveyor Belt':'Gate')+'</th><th>Total Flight '+nDays+' Hari</th><th>Rata-rata / Hari</th></tr></thead>' +
        '<tbody>' + summaryRows + '<tr class="total-row"><td>TOTAL</td><td class="num">'+grandTotal+'</td><td class="num">'+formatAvg(grandTotal/nDays)+' flight/hari</td></tr></tbody>' +
      '</table></div>' +
    '</div>';

  document.getElementById('reportRoot').innerHTML = html;
  lastReport = rep;
}

function setStatus(msg, isError) {
  var el = document.getElementById('statusMsg');
  el.textContent = msg||'';
  el.className = 'status-msg' + (isError?' error':'');
}

function generateReport() {
  var mode = document.querySelector('#tgMode .toggle-btn.active').dataset.mode;
  var from = document.getElementById('dateFrom').value;
  var to   = document.getElementById('dateTo').value;
  if (!from || !to) { setStatus('Pilih tanggal "Dari" dan "Sampai" terlebih dahulu.', true); return; }
  if (from > to) { setStatus('Tanggal "Dari" tidak boleh setelah tanggal "Sampai".', true); return; }

  var dateList = dateRangeList(from, to);
  var btn = document.getElementById('btnGenerate');
  btn.disabled = true; btn.textContent = 'Memuat…';
  document.getElementById('reportRoot').innerHTML = '<div class="state-msg">Memuat data ('+dateList.length+' hari)…</div>';
  setStatus('');

  fetchDays(dateList, function(done, totalN) {
    setStatus('Memuat data… ('+done+'/'+totalN+' hari)');
  }).then(function(flights) {
    var rep = aggregateReport(flights, dateList, mode);
    renderReport(rep);
    setStatus('');
  }).catch(function(err) {
    console.error(err);
    document.getElementById('reportRoot').innerHTML = '<div class="state-msg">Gagal memuat data.</div>';
    setStatus('Error: '+err.message, true);
  }).finally(function() {
    btn.disabled = false; btn.textContent = 'Tampilkan';
  });
}

function exportReportPdf() {
  if (!lastReport) { setStatus('Tampilkan laporan dulu sebelum export PDF.', true); return; }
  if (!window.jspdf) { setStatus('jsPDF belum siap, coba lagi sesaat.', true); return; }
  var rep = lastReport;
  var label = rep.mode==='belt' ? 'Conveyor Belt' : 'Gate';
  var nDays = rep.dateList.length;
  var grandTotal = 0;

  var { jsPDF } = window.jspdf;
  var doc = new jsPDF({ orientation: 'landscape', unit: 'mm', format: 'a4' });
  var PW = 297, ML = 12, MR = 12;

  doc.setFillColor(10,40,80);
  doc.rect(0,0,PW,20,'F');
  doc.setTextColor(255,255,255);
  doc.setFontSize(13); doc.setFont(undefined,'bold');
  doc.text('LAPORAN REALISASI PENGGUNAAN '+label.toUpperCase(), PW/2, 9, {align:'center'});
  doc.setFontSize(9); doc.setFont(undefined,'normal');
  doc.text('Bandar Udara Sultan Hasanuddin Makassar (UPG)  |  Periode '+formatShortDate(rep.dateList[0])+' - '+formatShortDate(rep.dateList[rep.dateList.length-1]), PW/2, 15, {align:'center'});

  var dayBody = rep.dateList.map(function(d) {
    var rowTotal = 0;
    var row = [formatDayLabel(d)].concat(rep.items.map(function(it){ var c=rep.dayMatrix[d][it]||0; rowTotal+=c; return c; }));
    row.push(rowTotal);
    grandTotal += rowTotal;
    return row;
  });
  var totalRow = ['TOTAL '+nDays+' HARI'].concat(rep.items.map(function(it){ return rep.itemTotals[it]||0; })).concat([grandTotal]);

  doc.autoTable({
    startY: 26,
    head: [['Hari / Tanggal'].concat(rep.items.map(function(it){ return label+' '+it; })).concat(['Total Flight'])],
    body: dayBody,
    foot: [totalRow],
    styles: { fontSize: 7.5, cellPadding: 2, halign: 'center' },
    headStyles: { fillColor: [10,40,80], textColor: [255,255,255], fontStyle: 'bold', halign: 'center' },
    footStyles: { fillColor: [225,232,242], textColor: [10,40,80], fontStyle: 'bold', halign: 'center' },
    columnStyles: { 0: { halign: 'left' } },
    alternateRowStyles: { fillColor: [245,248,252] },
    margin: { left: ML, right: MR },
  });

  var y = doc.lastAutoTable.finalY + 8;
  doc.setTextColor(10,40,80); doc.setFontSize(11); doc.setFont(undefined,'bold');
  doc.text('Rekap Penggunaan per '+label, ML, y);
  y += 4;

  var summaryBody = rep.items.map(function(it) {
    var total = rep.itemTotals[it]||0;
    return [label+' '+it, total, formatAvg(total/nDays)];
  });
  var summaryTotalRow = ['TOTAL', grandTotal, formatAvg(grandTotal/nDays)+' flight/hari'];

  doc.autoTable({
    startY: y,
    head: [[label, 'Total Flight '+nDays+' Hari', 'Rata-rata / Hari']],
    body: summaryBody,
    foot: [summaryTotalRow],
    styles: { fontSize: 8.5, cellPadding: 2.5, halign: 'center' },
    headStyles: { fillColor: [10,40,80], textColor: [255,255,255], fontStyle: 'bold', halign: 'center' },
    footStyles: { fillColor: [225,232,242], textColor: [10,40,80], fontStyle: 'bold', halign: 'center' },
    columnStyles: { 0: { halign: 'left' } },
    alternateRowStyles: { fillColor: [245,248,252] },
    margin: { left: ML, right: MR },
    tableWidth: 120,
  });

  doc.save('Laporan-Realisasi-'+label.replace(/\s+/g,'')+'-'+rep.dateList[0]+'_'+rep.dateList[rep.dateList.length-1]+'.pdf');
}

(function() {
  var root = document.documentElement;
  var btn  = document.getElementById('themeToggle');
  function applyTheme(t) {
    if (t === 'light') { root.setAttribute('data-theme','light'); btn.textContent='☀️'; }
    else               { root.removeAttribute('data-theme');       btn.textContent='🌙'; }
  }
  applyTheme(localStorage.getItem('laporanTheme') || 'dark');
  btn.addEventListener('click', function(){
    var next = root.getAttribute('data-theme') === 'light' ? 'dark' : 'light';
    localStorage.setItem('laporanTheme', next);
    applyTheme(next);
  });
})();

(function() {
  var btn = document.getElementById('hamBtn');
  var overlay = document.getElementById('navOverlay');
  var panel = document.getElementById('navPanel');
  function openNav(){ panel.classList.add('show'); overlay.classList.add('show'); }
  function closeNav(){ panel.classList.remove('show'); overlay.classList.remove('show'); }
  btn.addEventListener('click', openNav);
  overlay.addEventListener('click', closeNav);
  document.addEventListener('keydown', function(e){ if (e.key==='Escape') closeNav(); });
})();

function tickClock() {
  var now = new Date();
  document.getElementById('clock').textContent = String(now.getHours()).padStart(2,'0')+'.'+String(now.getMinutes()).padStart(2,'0')+'.'+String(now.getSeconds()).padStart(2,'0');
  var days = ['Minggu','Senin','Selasa','Rabu','Kamis','Jumat','Sabtu'];
  var months = ['Januari','Februari','Maret','April','Mei','Juni','Juli','Agustus','September','Oktober','November','Desember'];
  document.getElementById('clockDate').textContent = days[now.getDay()]+', '+now.getDate()+' '+months[now.getMonth()]+' '+now.getFullYear();
}
tickClock(); setInterval(tickClock, 1000);
